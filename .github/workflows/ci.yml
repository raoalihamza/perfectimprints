name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # SCRAPE-920: no `version` here on purpose - pnpm/action-setup reads the
      # exact pin from package.json `packageManager` (pnpm@9.12.0), and the
      # action now ERRORS if both are set (it killed monthly rebuild run #4).
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SITE_URL: https://perfectimprints.com
          NEXT_PUBLIC_GEIGER_HOST: https://patrickblack.geiger.com
