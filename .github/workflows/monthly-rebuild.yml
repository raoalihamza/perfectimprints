name: Monthly rebuild

# Full-catalog refresh (M6-606). Re-scrapes Geiger Phases A/B/C/E, regenerates
# AI content for any NEW categories, prunes removed products, re-expands the
# seven allowlisted categories from FIX-810, and opens a reviewable PR with a
# change summary + emails Patrick.
#
# ── The 6-hour-per-job constraint ────────────────────────────────────────────
# GitHub-hosted runners cap a single job at 6h. Phase C's main pass is
# ~2.6-2.8h at 6 workers (SCRAPE-901 counted ~60k paginated Searchspring
# requests, not the ~21.7k one-per-URL floor older comments assumed), and the
# recovery passes add an unbounded-ish search crawl on top, so the work is
# split into separate jobs joined by artifacts:
#   - scrape-ab         Phase A -> B -> B global top-up   (~30-50 min)
#   - scrape-e          Phase E (parallel; no Phase A)    (~5 min)
#   - scrape-c          Phase C main pass (the long pole)
#   - scrape-c-recover  Phase C brand + search fallbacks
#   - assemble          guard + AI content + prune + re-expand + summary + PR + email
# Phase C runs with `--workers 6` (6 independent 1-req/sec clients per
# CLAUDE.md §16) AND keeps `--resume` with a cached checkpoint, so an overrun
# resumes from the last 100-URL checkpoint on a re-run instead of restarting.
#
# ── SCRAPE-910: survive the blocked geiger.com fetches + never lose data ─────
# Two problems fixed together (docs/scrape-900-rebuild-403-diagnosis.md +
# docs/scrape-901-request-count.md):
# 1. Of the rebuild's ~61k requests, exactly three hit www.geiger.com, which
#    challenges GitHub's datacenter IPs. Phase A now falls back to the
#    committed categories.json (loudly, recorded in
#    data/geiger/taxonomy-fetch-status.json), Phase E keeps the committed
#    brands.json + logos on an index-fetch failure, and the redundant Phase A
#    step in scrape-e was removed (its comment claimed Phase E reads
#    categories.json; brand_logos.py never does). A fallback run misses only
#    NEW Geiger categories/brands; the summary email says so up front.
# 2. Two passes that built the committed data were only ever run BY HAND and
#    were never wired into any workflow - our own gap, nobody blocked us and
#    nothing changed underneath us. Without them a "successful" rebuild would
#    have LOST data: the Phase B global top-up (822 of 7,957 products exist
#    only through it; losing them would strip 55,891 product references off
#    4,319 category pages via the prune) and the Phase C brand/search
#    recovery passes (~3,434 facet URLs' filter data). Both are now steps in
#    this workflow. The assemble job additionally runs a data-loss guard
#    (scripts/monthly/verify-rebuild-data.ts) that FAILS the run instead of
#    opening a PR when products, product-bearing pages, or facet coverage
#    drop past deliberate margins.
#
# Phase D (PI→Geiger mapping) is intentionally NOT re-run: it's stable after the
# first run and the committed data/mappings/pi-to-geiger.json is used as-is.
#
# ── Manual-only + auto-merge (Site Refresh, 2026-06-30) ──────────────────────
# The monthly cron was REMOVED: this full-catalog rebuild now runs ONLY when
# Patrick presses "Full Catalog Rebuild" in the Sanity "Site Refresh" panel (or a
# manual workflow_dispatch). On success the assemble job AUTO-MERGES its own PR as
# the final step, using the exact commit title `chore(data): monthly catalog
# rebuild` so monthly-warmup.yml's gate fires and the 21K facet warmup runs after
# the production redeploy. (Previously the PR was opened for manual review.)
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEEPSEEK_API_KEY                      (AI content for new categories)
#   GMAIL_USER + GMAIL_APP_PASSWORD       (summary email)
# Optional: LEAD_EMAIL_TO / LEAD_EMAIL_FROM (default patrick@perfectimprints.com)
# No Sanity secrets needed — content is written to data/categories/*.json only.
# Actions settings must allow: Read/write permissions + "Allow GitHub Actions to
# create and approve pull requests" (same as the weekly scrape jobs).

on:
  # Manual-only (cron removed 2026-06-30). Triggered by the Sanity "Site Refresh"
  # panel (Full Catalog Rebuild) via the workflows API route, or a manual dispatch.
  workflow_dispatch:
    inputs:
      phases:
        description: 'Phases to run (comma list of A,B,C,E). Omit C to skip the ~1-6h membership scrape when testing.'
        required: false
        default: 'A,B,C,E'

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  PHASE_C_WORKERS: '6'

jobs:
  # ── Parse which phases to run ──────────────────────────────────────────────
  config:
    name: Resolve phase selection
    runs-on: ubuntu-latest
    outputs:
      run_ab: ${{ steps.flags.outputs.run_ab }}
      run_c: ${{ steps.flags.outputs.run_c }}
      run_e: ${{ steps.flags.outputs.run_e }}
    steps:
      - id: flags
        shell: bash
        env:
          # The Site Refresh "Full Catalog Rebuild" button (and the workflow's
          # default) sends A,B,C,E; this fallback covers a dispatch with no input.
          PHASES: ${{ github.event.inputs.phases || 'A,B,C,E' }}
        run: |
          up=$(echo "$PHASES" | tr '[:lower:]' '[:upper:]')
          contains() { echo ",$up," | tr -d ' ' | grep -q ",$1,"; }
          # A and B always travel together (B needs A's categories.json).
          if contains A || contains B; then echo "run_ab=true" >> "$GITHUB_OUTPUT"; else echo "run_ab=false" >> "$GITHUB_OUTPUT"; fi
          if contains C; then echo "run_c=true" >> "$GITHUB_OUTPUT"; else echo "run_c=false" >> "$GITHUB_OUTPUT"; fi
          if contains E; then echo "run_e=true" >> "$GITHUB_OUTPUT"; else echo "run_e=false" >> "$GITHUB_OUTPUT"; fi
          echo "Selected phases: $up"

  # ── Phase A → B: taxonomy + product catalog ────────────────────────────────
  scrape-ab:
    name: Phase A+B (taxonomy + products)
    needs: config
    if: needs.config.outputs.run_ab == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scraper deps
        working-directory: scripts/scrapers/geiger
        run: |
          pip install --upgrade pip
          pip install -e .

      # Resume Phase B from a cached checkpoint if a prior run of this month was
      # interrupted. The key is unique per run; restore-keys lets a re-run pick
      # up the latest partial checkpoint.
      - name: Restore Phase B checkpoint
        uses: actions/cache@v4
        with:
          path: scripts/scrapers/geiger/.checkpoint
          key: phase-b-${{ github.run_id }}
          restore-keys: |
            phase-b-

      # SCRAPE-910: on a blocked/failed fetch this no longer kills the job -
      # it keeps the committed categories.json and records the fallback in
      # data/geiger/taxonomy-fetch-status.json (surfaced in the PR + email).
      - name: Phase A — taxonomy discovery
        run: python -m scripts.scrapers.geiger.run --phase a

      - name: Phase B — product catalog
        run: python -m scripts.scrapers.geiger.run --phase b --resume

      # SCRAPE-910: the global no-filter pass. 822 of the committed 7,957
      # products (10.3%) are reachable ONLY through it - they sit in "Shop By"
      # virtual collections no leaf category lists. It was run by hand in May
      # 2026 and never wired in, so every fresh Phase B silently dropped those
      # products and the prune then stripped them from 4,319 category pages.
      # ~137 Searchspring requests, ~2-3 min, idempotent (merges by SKU into
      # the products.json Phase B just wrote). A failure fails this job: no
      # PR opens, and the data-loss guard would refuse the shrunken catalog
      # anyway.
      - name: Phase B - global top-up (products outside the leaf walk)
        run: python -m scripts.scrapers.geiger.run --phase b --global-only

      - name: Upload A+B output
        uses: actions/upload-artifact@v4
        with:
          name: geiger-ab
          retention-days: 3
          path: |
            data/geiger/categories.json
            data/geiger/products.json
            data/geiger/taxonomy-fetch-status.json

  # ── Phase E: brand logos (independent — re-runs quick Phase A) ──────────────
  scrape-e:
    name: Phase E (brand logos)
    needs: config
    if: needs.config.outputs.run_e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scraper deps
        working-directory: scripts/scrapers/geiger
        run: |
          pip install --upgrade pip
          pip install -e .

      # SCRAPE-910: the Phase A step that used to run here was removed. Its
      # comment claimed Phase E reads categories.json; it does not
      # (brand_logos.py reads only products.json and the shop-by-brand page,
      # verified in SCRAPE-910). Removing it drops one of the three blocked
      # www.geiger.com requests. Phase E itself is now non-fatal on an
      # index-fetch failure: it keeps the committed brands.json + logos and
      # records the fallback in data/geiger/brand-index-fetch-status.json.
      - name: Phase E — brand logos
        run: python -m scripts.scrapers.geiger.run --phase e

      - name: Upload Phase E output
        uses: actions/upload-artifact@v4
        with:
          name: geiger-e
          retention-days: 3
          path: |
            data/geiger/brands.json
            data/geiger/brand-logos
            public/brand-logos
            data/geiger/brand-index-fetch-status.json

  # ── Phase C: facet/modifier memberships (the long pole) ────────────────────
  scrape-c:
    name: Phase C (facet memberships)
    needs: [config, scrape-ab]
    # Run when C is selected and scrape-ab didn't fail (scrape-ab may be SKIPPED
    # if only C was requested for testing — then the committed products.json is
    # used). !cancelled() lets this run even when scrape-ab was skipped.
    if: needs.config.outputs.run_c == 'true' && !cancelled() && needs.scrape-ab.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scraper deps
        working-directory: scripts/scrapers/geiger
        run: |
          pip install --upgrade pip
          pip install -e .

      # Use the fresh categories.json + products.json from scrape-ab when present;
      # otherwise fall back to the committed copies from checkout.
      - name: Download A+B output
        if: needs.scrape-ab.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: geiger-ab
          path: data/geiger

      # Resume Phase C from its checkpoint if this month's run was interrupted
      # (e.g. a job approached the 6h limit). The 100-URL checkpoint means a
      # re-run continues instead of restarting the ~21,715-URL crawl.
      - name: Restore Phase C checkpoint
        uses: actions/cache@v4
        with:
          path: scripts/scrapers/geiger/.checkpoint
          key: phase-c-${{ github.run_id }}
          restore-keys: |
            phase-c-

      - name: Phase C — facet/modifier memberships
        run: python -m scripts.scrapers.geiger.run --phase c --workers ${{ env.PHASE_C_WORKERS }} --resume

      - name: Upload Phase C output
        uses: actions/upload-artifact@v4
        with:
          name: geiger-c
          retention-days: 3
          path: data/geiger/facet-memberships.json

  # ── Phase C recovery: the brand + search fallback passes ───────────────────
  # SCRAPE-910: these two passes were run BY HAND when the catalog was first
  # built (May 2026) and never wired into any workflow - our own gap, nobody
  # blocked us. They recovered ~3,434 zero-result URLs (809 via brand-only
  # queries, 2,625 via full-text search; CLAUDE.md §16 Tiers 1-2). Without
  # them a fresh Phase C regenerates facet-memberships.json WITHOUT those
  # recoveries and the filter sidebar/facet counts lose those URLs. Both
  # passes hit ONLY Searchspring (never geiger.com), are idempotent, and are
  # self-narrowing: they touch only currently-zero URLs, write back only URLs
  # that GAIN products, so a re-run redoes less each time. They live in their
  # own job (not extra steps in scrape-c) so the combined crawl cannot push a
  # single job past the 6h runner cap; Tier 1 is minutes, Tier 2 re-queries
  # every remaining zero facet URL (~10k searches, roughly 1-3h at 6 workers).
  # A failure here BLOCKS assemble (see its `if`): shipping the unrecovered
  # memberships file would regress ~3,434 URLs, which is exactly what the
  # data-loss guard exists to refuse.
  scrape-c-recover:
    name: Phase C recovery (brand + search fallbacks)
    needs: [config, scrape-ab, scrape-c]
    if: needs.config.outputs.run_c == 'true' && !cancelled() && needs.scrape-c.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scraper deps
        working-directory: scripts/scrapers/geiger
        run: |
          pip install --upgrade pip
          pip install -e .

      # Both passes read products.json (brand-name index + SKU-to-category
      # filtering); use the fresh copy when Phase B ran, else the committed one.
      - name: Download A+B output
        if: needs.scrape-ab.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: geiger-ab
          path: data/geiger

      - name: Download Phase C output
        uses: actions/download-artifact@v4
        with:
          name: geiger-c
          path: data/geiger

      - name: Tier 1 - brand fallback for zero brand URLs
        run: python -m scripts.scrapers.geiger.run --phase c --retry-brands --workers ${{ env.PHASE_C_WORKERS }}

      - name: Tier 2 - search fallback for remaining zero facet URLs
        run: python -m scripts.scrapers.geiger.run --phase c --retry-search --workers ${{ env.PHASE_C_WORKERS }}

      - name: Upload recovered Phase C output
        uses: actions/upload-artifact@v4
        with:
          name: geiger-c-recovered
          retention-days: 3
          path: data/geiger/facet-memberships.json

  # ── Assemble: AI content, prune, summary, PR, email ────────────────────────
  assemble:
    name: Guard + content + prune + re-expand + PR + email
    needs: [config, scrape-ab, scrape-c, scrape-c-recover, scrape-e]
    # Run as long as at least one scrape job succeeded (so a phase-subset test
    # still assembles), and none of the requested jobs hard-failed. A failed
    # scrape-c-recover blocks assembly too (SCRAPE-910): shipping the
    # unrecovered memberships file would regress ~3,434 facet URLs.
    if: >
      !cancelled() &&
      (needs.scrape-ab.result == 'success' || needs.scrape-c.result == 'success' || needs.scrape-e.result == 'success') &&
      needs.scrape-ab.result != 'failure' &&
      needs.scrape-c.result != 'failure' &&
      needs.scrape-c-recover.result != 'failure' &&
      needs.scrape-e.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Install AI pipeline deps
        working-directory: scripts/ai-pipeline
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Pull fresh scrape outputs over the committed copies. Each download is
      # gated on its job having succeeded; a skipped phase leaves the committed
      # file in place.
      - name: Download A+B output
        if: needs.scrape-ab.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: geiger-ab
          path: data/geiger

      - name: Download Phase C output
        if: needs.scrape-c.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: geiger-c
          path: data/geiger

      # SCRAPE-910: the recovered memberships file (brand + search fallbacks
      # merged in) overwrites the main-pass file downloaded above.
      - name: Download recovered Phase C output
        if: needs.scrape-c-recover.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: geiger-c-recovered
          path: data/geiger

      - name: Download Phase E output
        if: needs.scrape-e.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: geiger-e
          path: .

      # SCRAPE-910 data-loss guard: compare the fresh data on disk against the
      # committed versions at HEAD and FAIL the run (no PR, no email, no
      # merge) if the catalog shrank past deliberate margins: total products
      # -5%, product-bearing category pages -2%, facet URLs with products -5%.
      # Products legitimately disappear when Geiger discontinues them; a small
      # drop is normal and a large one is a bug. Runs BEFORE prune so the
      # baked category JSONs on disk are still the HEAD baseline. This step is
      # the reason Patrick can press the button unattended.
      - name: Data-loss guard (fail instead of shipping a shrunken catalog)
        run: pnpm tsx scripts/monthly/verify-rebuild-data.ts

      # Generate AI content ONLY for categories that don't yet have a JSON
      # (--skip-existing). New Geiger categories that surfaced this month get
      # fresh copy; existing pages are untouched. No-op if nothing is new.
      - name: Generate AI content for new categories
        if: needs.scrape-ab.result == 'success'
        working-directory: scripts/ai-pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::DEEPSEEK_API_KEY not set — skipping AI content for new categories."
            exit 0
          fi
          python generate_content.py --skip-existing

      # Drop removed Geiger SKUs from the baked category productSkus[] arrays.
      - name: Prune removed products from category pages
        if: needs.scrape-ab.result == 'success'
        run: pnpm tsx scripts/monthly/prune-removed-skus.ts

      # Re-derive the seven allowlisted categories whose slug-token filter
      # misfired (FIX-810). Nothing else in this job ADDS products to an
      # existing page - generate_content.py runs --skip-existing and the prune
      # only ever removes - so without this step those seven pages shrink a
      # little with every rebuild. Must stay AFTER the prune (it re-derives from
      # the catalog, so it would undo a prune that ran later) and BEFORE the
      # summary, so its changes reach the diff, the PR and Patrick's email.
      # `add-paths` already covers data/categories.
      - name: Re-expand the safe capped categories
        if: needs.scrape-ab.result == 'success'
        run: pnpm tsx scripts/monthly/expand-safe-capped-categories.ts

      - name: Compute change summary
        id: summary
        run: pnpm tsx scripts/monthly/compute-summary.ts

      - name: Open rebuild PR
        id: pr
        if: steps.summary.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(data): monthly catalog rebuild'
          title: 'chore(data): monthly catalog rebuild'
          body-path: scripts/monthly/.artifacts/pr-body.md
          branch: monthly-rebuild
          delete-branch: true
          add-paths: |
            data/geiger/categories.json
            data/geiger/products.json
            data/geiger/facet-memberships.json
            data/geiger/brands.json
            data/geiger/brand-logos
            public/brand-logos
            data/categories

      # SCRAPE-910: also email when a geiger.com fallback happened even if no
      # data changed - a silent fallback that quietly ships stale taxonomy is
      # its own kind of failure, so Patrick hears about it either way.
      - name: Email Patrick the summary
        if: steps.summary.outputs.changed == 'true' || steps.summary.outputs.fallback == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LEAD_EMAIL_TO: ${{ secrets.LEAD_EMAIL_TO }}
          LEAD_EMAIL_FROM: ${{ secrets.LEAD_EMAIL_FROM }}
          MONTHLY_PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: pnpm tsx scripts/monthly/send-summary-email.ts

      # Auto-merge as the FINAL step — only after the whole rebuild succeeded AND a
      # PR was opened (no PR for an empty run). The squash subject MUST stay exactly
      # `chore(data): monthly catalog rebuild` so monthly-warmup.yml's gate fires
      # and the 21K facet warmup runs once after the production redeploy (see
      # monthly-warmup.yml + post-deploy-warmup.yml). Merge is LAST so a Cancel
      # before it leaves main untouched (Site Refresh Cancel also closes this PR +
      # deletes the `monthly-rebuild` branch). Patrick still gets the summary email
      # above for the record.
      - name: Auto-merge the rebuild PR
        if: steps.summary.outputs.changed == 'true' && steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --squash --delete-branch \
                 --subject 'chore(data): monthly catalog rebuild'; then
              echo "Merged PR #$PR."
              exit 0
            fi
            echo "Merge attempt $i failed (PR may still be computing mergeability); retrying in 10s…"
            sleep 10
          done
          echo "::error::Could not auto-merge PR #$PR after retries."
          exit 1

      - name: No changes — skip PR/email
        if: steps.summary.outputs.changed != 'true'
        run: echo "No data changed this month — nothing to commit."
