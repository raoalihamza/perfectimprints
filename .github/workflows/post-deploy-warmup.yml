name: Post-deploy warmup

# Warms the SMART warmup list (see CLAUDE.md Section 13 and
# scripts/warmup/build-warmup-list.ts): nav-guaranteed categories + the top
# WARMUP_FACET_CAP (3,500) single-facet pages by SKU count — down from all
# ~21,139 facet pages (2026-07-06 cost optimization; the full crawl was the
# main driver of Vercel ISR-write + Sanity API-read costs). Warmed pages skip
# the 400-800ms cold first hit after the monthly rebuild turns them cold; the
# remaining ~17K facets generate on-demand on first visit and cache — intended.
#
# ── This is NOT a per-deploy job ─────────────────────────────────────────────
# It used to fire on `deployment_status: success` for EVERY Vercel deploy and
# pre-hit all ~21K facet URLs each time. With several deploys a week (the weekly
# deals/new/rush scrape PRs + ordinary commits — none of which change facet
# pages) that generated millions of edge requests + ISR writes and exhausted
# Vercel's (account-wide, not per-project) free-tier limits. A warmup is only
# actually needed after the MONTHLY full-catalog rebuild, which is the one
# event that turns every facet page cold.
#
# So warmup now runs only:
#   • automatically after the monthly rebuild's PRODUCTION deploy succeeds —
#     `.github/workflows/monthly-warmup.yml` gates on that single deploy and
#     calls this workflow (workflow_call) targeting production www, and
#   • manually via workflow_dispatch for ad-hoc warmup (rollback, killed run,
#     staging smoke test).
#
# On-demand SSG works fine without warmup — a cold facet just serves its first
# hit at ~400-800ms then caches permanently until the next deploy — so dropping
# per-deploy warming costs only a little long-tail speed right after small
# deploys, and saves the recurring resource drain.
#
# ── Two warm scopes (2026-07-06, "Warm All Pages" button) ────────────────────
# `warm_scope` input selects what gets crawled:
#   • 'smart' (DEFAULT — used by the automatic monthly path and any dispatch
#     that doesn't say otherwise): the capped list above (~3,500 + nav).
#   • 'all': EVERY category URL in data/pi-urls/category-urls.json (~22,180).
#     Only the Sanity Studio "Site Refresh → Warm All Pages" button (and an
#     explicit manual dispatch) passes this — it costs real Vercel/Sanity
#     resources, so it is opt-in and confirmed with a cost warning in Studio.
on:
  # Reusable: called by monthly-warmup.yml after the monthly rebuild ships.
  workflow_call:
    inputs:
      site_url:
        description: 'Target site URL to warm.'
        type: string
        required: false
        default: 'https://dev.perfectimprints.com'
      warm_scope:
        # 'smart' (default) = the capped list (nav-guaranteed + top 3,500 facets
        # by SKU count) — what the automatic monthly path uses. 'all' = EVERY
        # category URL in data/pi-urls/category-urls.json (~22,180 pages) — used
        # only by the Studio "Warm All Pages" button / explicit manual dispatch.
        description: "Warm scope: 'smart' (capped list) or 'all' (every category page)."
        type: string
        required: false
        default: 'smart'
  # Manual: ad-hoc warmup (defaults to staging; pass production www to warm prod).
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target site URL (default: staging https://dev.perfectimprints.com)'
        required: false
        default: 'https://dev.perfectimprints.com'
      warm_scope:
        description: "Warm scope: 'smart' (capped ~3.5K list, default) or 'all' (every ~22,180 category pages — costs more, use after a full rebuild)"
        required: false
        default: 'smart'

jobs:
  warmup:
    name: Warm on-demand SSG facet pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Warm facet pages
        env:
          # `inputs.site_url` / `inputs.warm_scope` are provided by BOTH
          # workflow_call and workflow_dispatch; fall back to staging + the
          # capped smart list if somehow unset.
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site_url || 'https://dev.perfectimprints.com' }}
          WARMUP_SCOPE: ${{ inputs.warm_scope || 'smart' }}
        run: pnpm tsx scripts/warmup/warmup-facets.ts
