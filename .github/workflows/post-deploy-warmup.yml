name: Post-deploy warmup

# Fires after Vercel publishes a successful deploy. Warms all 21,139 on-demand
# SSG facet pages (see CLAUDE.md Section 13) so visitors don't pay the 400-800ms
# cold-start penalty for the first 24-48h after deploy.
#
# Target host: taken from the deployment's environment_url when present, so this
# auto-targets whichever host Vercel just deployed (currently dev.perfectimprints.com
# while staging is the only live env; switches to www.perfectimprints.com automatically
# once production goes live). Manual workflow_dispatch defaults to the staging host.
#
# Trigger sources:
#   1. deployment_status — GitHub fires this when Vercel's GitHub integration
#      reports the deploy finished. We filter to success only.
#   2. workflow_dispatch — manual trigger for ad-hoc warmup (e.g. after a
#      rollback or if a previous run was killed).
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Target site URL (default: staging https://dev.perfectimprints.com)'
        required: false
        default: 'https://dev.perfectimprints.com'

jobs:
  warmup:
    name: Warm on-demand SSG facet pages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # deployment_status fires for every deploy in every env. Only run on success;
    # workflow_dispatch always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Warm facet pages
        env:
          # Prefer Vercel's reported environment_url so we hit the host that was just
          # deployed; fall back to workflow_dispatch input; fall back to staging.
          NEXT_PUBLIC_SITE_URL: >-
            ${{ github.event.deployment_status.environment_url
                || github.event.inputs.site_url
                || 'https://dev.perfectimprints.com' }}
        run: pnpm tsx scripts/warmup/warmup-facets.ts
