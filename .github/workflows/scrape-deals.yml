name: Weekly deals scrape

on:
  schedule:
    # Every Sunday at 23:00 UTC. Patrick (US Central) sees fresh deals Monday morning.
    - cron: '0 23 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    name: Scrape Geiger /b/deals and open auto-merge PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper deps
        working-directory: scripts/scrapers/geiger
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run deals scraper
        run: python -m scripts.scrapers.geiger.scrape_deals

      - name: Diff data/geiger/deals.json
        id: diff
        run: |
          if git diff --quiet --exit-code data/geiger/deals.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open auto-merge PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(deals): weekly deals snapshot refresh'
          title: 'chore(deals): weekly deals snapshot refresh'
          body: |
            Automated weekly refresh of `data/geiger/deals.json` from Geiger's
            Searchspring `/b/deals` endpoint. Includes products + per-facet-value
            SKU memberships for the /deals filter sidebar.

            Vercel will redeploy on merge.
          branch: chore/weekly-deals-refresh
          delete-branch: true
          add-paths: |
            data/geiger/deals.json

      - name: No changes — skip PR
        if: steps.diff.outputs.changed == 'false'
        run: echo "deals.json unchanged this week — nothing to commit."
