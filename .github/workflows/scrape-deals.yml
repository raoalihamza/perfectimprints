name: Weekly deals scrape

on:
  schedule:
    # Every Sunday at 23:00 UTC. Patrick (US Central) sees fresh deals Monday morning.
    - cron: '0 23 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    name: Scrape Geiger /b/deals and open auto-merge PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper deps
        working-directory: scripts/scrapers/geiger
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run deals scraper
        run: python -m scripts.scrapers.geiger.scrape_deals

      - name: Diff data/geiger/deals.json
        id: diff
        run: |
          if git diff --quiet --exit-code data/geiger/deals.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open auto-merge PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(deals): weekly deals snapshot refresh'
          title: 'chore(deals): weekly deals snapshot refresh'
          body: |
            Automated weekly refresh of `data/geiger/deals.json` from Geiger's
            Searchspring `/b/deals` endpoint. Includes products + per-facet-value
            SKU memberships for the /deals filter sidebar.

            Vercel will redeploy on merge.
          branch: chore/weekly-deals-refresh
          delete-branch: true
          add-paths: |
            data/geiger/deals.json

      # Auto-merge as the FINAL step — only after the scrape succeeded AND a PR was
      # opened (no PR for an empty run). Squash-merges to main so the change ships
      # and Vercel redeploys without anyone touching GitHub. Behaviour is identical
      # whether this run started from cron or the Sanity "Site Refresh" button. The
      # merge is LAST so a Cancel before it leaves main untouched (the Site Refresh
      # Cancel button additionally closes this PR + deletes the branch).
      - name: Auto-merge the PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --squash --delete-branch \
                 --subject 'chore(deals): weekly deals snapshot refresh'; then
              echo "Merged PR #$PR."
              exit 0
            fi
            echo "Merge attempt $i failed (PR may still be computing mergeability); retrying in 10s…"
            sleep 10
          done
          echo "::error::Could not auto-merge PR #$PR after retries."
          exit 1

      - name: No changes — skip PR
        if: steps.diff.outputs.changed == 'false'
        run: echo "deals.json unchanged this week — nothing to commit."
