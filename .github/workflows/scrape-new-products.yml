name: Weekly new-products scrape

on:
  # Weekly cron disabled on request 2026-07 (cost control); re-enable by
  # uncommenting. Still runnable from the Site Refresh panel / manual dispatch.
  # schedule:
  #   # Every Sunday at 23:30 UTC — 30 min after the deals scrape so the two jobs
  #   # don't fight over the same runner / git remote. Patrick (US Central) sees
  #   # fresh new-products data Monday morning.
  #   - cron: '30 23 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    name: Scrape Geiger /b/new-products and open auto-merge PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper deps
        working-directory: scripts/scrapers/geiger
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run new-products scraper
        run: python -m scripts.scrapers.geiger.scrape_new_products

      - name: Diff data/geiger/new-products.json
        id: diff
        run: |
          if git diff --quiet --exit-code data/geiger/new-products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open auto-merge PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(new-products): weekly new-products snapshot refresh'
          title: 'chore(new-products): weekly new-products snapshot refresh'
          body: |
            Automated weekly refresh of `data/geiger/new-products.json` from
            Geiger's Searchspring `/b/new-products` endpoint. Includes products
            + per-facet-value SKU memberships for the /new-products filter
            sidebar.

            Vercel will redeploy on merge.
          branch: chore/weekly-new-products-refresh
          delete-branch: true
          add-paths: |
            data/geiger/new-products.json

      # Auto-merge as the FINAL step — only after the scrape succeeded AND a PR was
      # opened (no PR for an empty run). Squash-merges to main so the change ships
      # and Vercel redeploys without anyone touching GitHub. Behaviour is identical
      # whether this run started from cron or the Sanity "Site Refresh" button. The
      # merge is LAST so a Cancel before it leaves main untouched (the Site Refresh
      # Cancel button additionally closes this PR + deletes the branch).
      - name: Auto-merge the PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --squash --delete-branch \
                 --subject 'chore(new-products): weekly new-products snapshot refresh'; then
              echo "Merged PR #$PR."
              exit 0
            fi
            echo "Merge attempt $i failed (PR may still be computing mergeability); retrying in 10s…"
            sleep 10
          done
          echo "::error::Could not auto-merge PR #$PR after retries."
          exit 1

      - name: No changes — skip PR
        if: steps.diff.outputs.changed == 'false'
        run: echo "new-products.json unchanged this week — nothing to commit."
